name: Deploy to GitHub Pages

# Dispara em push na main OU manualmente via Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Garante que só rode um deploy por vez (evita race em pushes rápidos).
concurrency:
  group: pages
  cancel-in-progress: false

# Permissões mínimas necessárias para o Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Garante que o vite.config.js use o base correto para /<repo>/
          # independente do nome do projeto.
          GITHUB_PAGES_REPO: ${{ github.event.repository.name }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
