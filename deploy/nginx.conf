# Config de referência do vhost Nginx para vinnisantos.com.br.
# Ajuste o caminho de `root` para onde o conteúdo de `dist/` fica na VM.
server {
    listen 80;
    listen [::]:80;
    server_name vinnisantos.com.br www.vinnisantos.com.br;

    root /var/www/vinnisantos.com.br/dist;
    index index.html;

    # Cada rota tem um HTML próprio gerado no build (scripts/prerender.mjs), com
    # title/description/canonical daquela página: /projects -> projects.html.
    # O que não tiver HTML próprio cai no index.html e o React Router decide.
    # Sem `$uri/` de propósito: ele faria /en redirecionar para /en/.
    location / {
        try_files $uri $uri.html /index.html;
    }

    # HTML sempre revalidado, para um deploy novo aparecer na hora.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Assets com hash no nome (Vite) podem ter cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
}
